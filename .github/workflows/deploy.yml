name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # Images are built here rather than on the deploy host: the VPS needs ~20
  # minutes for a single Nuxt build, which blew the job timeout and rebuilt from
  # scratch on every deploy. Runners are faster and keep a layer cache.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ui
            dockerfile: deploy/ui.Dockerfile
          - name: api
            dockerfile: deploy/api.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is empty"
            exit 1
          }
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is not a valid private key"
            exit 1
          }
          echo "Deployment key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key
          # ssh-keyscan intermittently returns nothing (exit 1) from runners;
          # retry rather than failing the whole deploy on a transient blip.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts && \
               grep -q . ~/.ssh/known_hosts; then
              break
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying"
            sleep 5
            [ "$attempt" -eq 5 ] && {
              echo "::error::could not scan host key for $DEPLOY_HOST"
              exit 1
            }
          done
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "true"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tinyschool' }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN || 'tinyschool.147.93.97.228.nip.io' }}
          DEPLOY_SSH_KEY: /home/runner/.ssh/deploy_key
          IMAGE_UI: ${{ env.IMAGE_PREFIX }}-ui:${{ github.sha }}
          IMAGE_API: ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          # Job-scoped token, so the host never stores a long-lived credential.
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy.sh
