name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
        run: |
          install -m 700 -d ~/.ssh
          test -n "$SSH_PRIVATE_KEY" || {
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is empty"
            exit 1
          }
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "::error::DEPLOY_SSH_PRIVATE_KEY is not a valid private key"
            exit 1
          }
          echo "Deployment key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "true"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '147.93.97.228' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tinyschool' }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN || 'tinyschool.147.93.97.228.nip.io' }}
          DEPLOY_SSH_KEY: /home/runner/.ssh/deploy_key
        run: ./scripts/deploy.sh
